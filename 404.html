<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KUO Anime</title>
  <script>
    (function () {
      var l = window.location;
      var repoName = '/kuo-anime';
      var path = l.pathname;
      
      if (path.startsWith(repoName)) {
        path = path.slice(repoName.length);
      }
      
      var fullPath = path + l.search + l.hash;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoName + '/?p=' + encodeURIComponent(fullPath)
      );
    })();
  </script>
</head>
<body></body>
</html>
